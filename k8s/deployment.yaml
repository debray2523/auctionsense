apiVersion: apps/v1
kind: Deployment
metadata:
  name: auctionsense
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auctionsense
  template:
    metadata:
      labels:
        app: auctionsense
    spec:
      containers:
      - name: api
        image: debray2523/auctionsense:1.2.0
        command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000